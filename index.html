<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Estudiante de Programación</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra de navegación -->
    <header>
        <div class="logo">EP</div>
        <nav>
            <a href="#proyectos">Proyectos</a>
            <a href="#sobre-mi">Acerca de</a>
            <a href="#contacto">Contacto</a>
        </nav>
        <span class="badge">Disponible para proyectos</span>
    </header>

    <!-- Sección Principal (Hero) -->
    <section class="hero">
        <div class="hero-text">
            <span>Estudiante</span> <span class="highlight">de programación</span>
        </div>
        <div class="hero-card">
            <div class="glow-circle">
                <!-- Aquí asegúrate de poner el nombre exacto de tu archivo de foto -->
                <img src="tu-foto.png" alt="Mi foto de perfil">
            </div>
        </div>
        <div class="hero-name">
            <h1>Tu Nombre</h1>
            <p>Tus Apellidos</p>
        </div>
    </section>

    <!-- Sección de Proyectos -->
    <section id="proyectos" class="projects">
        <h2>Proyectos</h2>
        <p class="subtitle-projects">Muy pronto.</p>
        <div class="project-grid">
            <div class="card">01</div>
            <div class="card">02</div>
            <div class="card">03</div>
            <div class="card">04</div>
            <div class="card">05</div>
        </div>
    </section>
</body>
</html>
